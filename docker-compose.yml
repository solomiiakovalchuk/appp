version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: newsblog
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: newsblog  
      MYSQL_USER: user            
      MYSQL_PASSWORD: password   
      MYSQL_ROOT_HOST: '%'
    command: --default-authentication-plugin=mysql_native_password  
    ports:
      - "3306:3306"  
    volumes:
      - mysql_data:/var/lib/mysql  
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
